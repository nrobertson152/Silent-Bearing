name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
      - name: Import project
        run: ./godot --headless --path . --import || true
      - name: Run simulation tests
        run: ./godot --headless --path . -s tests/run_tests.gd
      - name: Launch a patrol (catches missing files and script errors)
        run: |
          rm -rf .godot
          ./godot --headless --path . -- --autostart us shokaku --smoke 8 2>&1 | tee smoke.log
          if grep -q "SCRIPT ERROR" smoke.log || ! grep -q "SMOKE OK" smoke.log; then
            echo "::error::The game failed to start a patrol"; exit 1
          fi
      - name: Start a near-future patrol
        run: |
          ./godot --headless --path . -- --autostart us_ssn fujian --smoke 8 2>&1 | tee smoke_modern.log
          if grep -q "SCRIPT ERROR" smoke_modern.log || ! grep -q "SMOKE OK" smoke_modern.log; then
            echo "::error::The game failed to start a near-future patrol"; exit 1
          fi
      - name: Walk through every watertight door
        run: |
          for n in "us shokaku" "uk tirpitz" "de hood" "jp yorktown"; do
            ./godot --headless --path . -s tools/walk_test.gd -- $n 2>&1 | tee -a walk.log
          done
          if grep -q "SCRIPT ERROR\|WALK .* FAIL" walk.log; then exit 1; fi
      - name: Deck, deck gun, outside view and dying on deck
        run: |
          for n in "us shokaku" "uk tirpitz" "de hood" "jp yorktown"; do
            ./godot --headless --path . -s tools/deck_test.gd -- - $n 2>&1 | tee -a deck.log
          done
          if grep -q "SCRIPT ERROR\|DECK FAIL\|DECK .* FAIL" deck.log; then exit 1; fi
      - name: Ships founder, capsize, blow up and break in two with the view attached
        run: |
          ./godot --headless --path . -s tools/sink_test.gd 2>&1 | tee sink.log
          if grep -q "SCRIPT ERROR\|SINK FAIL" sink.log || ! grep -q "SINK OK" sink.log; then exit 1; fi

  export:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot and export templates
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/linux_release.x86_64 templates/windows_release_x86_64.exe templates/version.txt \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Import project
        run: ./godot --headless --path . --import || true
      - name: Export Linux and Windows
        run: |
          mkdir -p build/linux build/windows
          ./godot --headless --path . --export-release "Linux" build/linux/SilentBearing.x86_64
          ./godot --headless --path . --export-release "Windows" build/windows/SilentBearing.exe
      - name: Package
        run: |
          cp README.md LICENSE build/linux/
          cp README.md LICENSE build/windows/
          tar -czf SilentBearing-linux-x86_64.tar.gz -C build/linux .
          (cd build/windows && zip -q -r ../../SilentBearing-windows-x86_64.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: SilentBearing-linux-x86_64
          path: SilentBearing-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: SilentBearing-windows-x86_64
          path: SilentBearing-windows-x86_64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SilentBearing-linux-x86_64.tar.gz
            SilentBearing-windows-x86_64.zip
